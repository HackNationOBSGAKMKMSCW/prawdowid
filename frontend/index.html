<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2f63" />
    <meta
      name="description"
      content="Prawdowid – wklej wiadomość albo link i sprawdź, co mówią o tym wiarygodne źródła. Za darmo, bez logowania."
    />
    <title>Sprawdź wiadomość – Prawdowid</title>
    <script>
      // Motyw przed pierwszym renderem, żeby strona nie mrugała jasnym tłem.
      try {
        var p = JSON.parse(localStorage.getItem('prawdowid:preferences') || '{}');
        var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
