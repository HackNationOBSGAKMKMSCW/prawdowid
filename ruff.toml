line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "node_modules", "dist", "build"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # line length is handled by the formatter

[lint.per-file-ignores]
# FastAPI: Depends(guard.require("uprawnienie")) w domyślnym argumencie to wzorzec zależności
"**/api.py" = ["B008"]
